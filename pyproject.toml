[project]
name = "long-chess"
version = "1.2.0"
description = "Companion repository for 'The maximum length of a chess game under the 2023 FIDE Laws'"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Junyeop Yim", email = "junyeobe0315@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11",
]

[project.urls]
Repository = "https://github.com/junyeobe0315/longest-chess-game"

[project.optional-dependencies]
solver = [
    "ortools>=9.15.6755",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
